name: Deploy on Self-Hosted Pi

on:
  push:
    branches: [ main ]

jobs:
  deploy:
    runs-on: self-hosted 

    steps:
    - name: Pull latest code
      run: |
        cd /DATA/AppData/analparking.top
        sudo git reset --hard origin/main
        git pull

    - name: Rebuild containers
      run: |
        cd /DATA/AppData/analparking.top
        sudo docker compose up -d --build

    - name: Restart queue worker
      run: |
        cd /DATA/AppData/analparking.top
        sudo docker compose restart queue
